<body>
<div id="stage">
<svg id="clock" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ذهب لامع -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset=".22" stop-color="#f3d27a"/>
      <stop offset=".45" stop-color="#c7952f"/>
      <stop offset=".62" stop-color="#8a6417"/>
      <stop offset=".8" stop-color="#e2bd5c"/>
      <stop offset="1" stop-color="#fff0b8"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".3" stop-color="#f1cf6d"/>
      <stop offset=".55" stop-color="#c99a35"/>
      <stop offset=".72" stop-color="#8f6a1c"/>
      <stop offset="1" stop-color="#ecca6a"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b4c12"/>
      <stop offset=".5" stop-color="#b8892c"/>
      <stop offset="1" stop-color="#5a3f0e"/>
    </linearGradient>
    <!-- وجه الساعة -->
    <radialGradient id="face" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#1b2b52"/>
      <stop offset=".55" stop-color="#0e1832"/>
      <stop offset="1" stop-color="#060b18"/>
    </radialGradient>
    <!-- لمعة زجاج -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".13"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- زخرفة نجمة ثمانية خفيفة -->
    <pattern id="star" width="70" height="70" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#d9b45a" stroke-opacity=".07" stroke-width="1.2">
        <rect x="20" y="20" width="30" height="30"/>
        <rect x="20" y="20" width="30" height="30" transform="rotate(45 35 35)"/>
        <circle cx="35" cy="35" r="6"/>
      </g>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".65"/>
    </filter>
    <clipPath id="faceClip"><circle cx="500" cy="500" r="418"/></clipPath>
  </defs>

  <!-- هالة خلف الساعة -->
  <circle cx="500" cy="500" r="492" fill="none" stroke="#e8c15a" stroke-opacity=".18" stroke-width="22" filter="url(#glow)"/>

  <!-- الإطار الذهبي -->
  <circle cx="500" cy="500" r="486" fill="url(#gold)" filter="url(#shadow)"/>
  <circle cx="500" cy="500" r="462" fill="url(#goldDark)"/>
  <circle cx="500" cy="500" r="452" fill="url(#gold)"/>
  <circle cx="500" cy="500" r="436" fill="#05080f"/>
  <circle cx="500" cy="500" r="430" fill="url(#gold)"/>

  <!-- الوجه -->
  <circle cx="500" cy="500" r="418" fill="url(#face)"/>
  <circle cx="500" cy="500" r="418" fill="url(#star)"/>
  <circle cx="500" cy="500" r="300" fill="none" stroke="url(#gold)" stroke-opacity=".35" stroke-width="1.5"/>
  <circle cx="500" cy="500" r="292" fill="none" stroke="url(#gold)" stroke-opacity=".2" stroke-width="1"/>

  <!-- العلامات والأرقام (تُرسم بالسكربت) -->
  <g id="ticks"></g>
  <g id="nums" class="calli" fill="url(#goldV)" font-size="64" text-anchor="middle" dominant-baseline="central"></g>

  <!-- ديوانية الكويت -->
  <text x="500" y="352" class="calli" font-size="96" fill="url(#goldV)" text-anchor="middle" dominant-baseline="central" filter="url(#shadow)">ديوانية الكويت</text>
  <!-- زخرفة تحت الاسم -->
  <g fill="url(#gold)" stroke="none">
    <path d="M330 410 Q415 432 500 410 Q585 432 670 410 Q585 444 500 424 Q415 444 330 410Z" opacity=".9"/>
    <path d="M500 400 l10 12 l-10 12 l-10 -12z"/>
    <circle cx="322" cy="410" r="5"/><circle cx="678" cy="410" r="5"/>
  </g>

  <!-- الوقت الرقمي والتاريخ -->
  <text id="digital" x="500" y="640" class="naskh" font-size="58" fill="#f6e3a6" text-anchor="middle" dominant-baseline="central" letter-spacing="2">--:--</text>
  <text id="hijri" x="500" y="700" class="naskh" font-size="30" fill="#d9b45a" text-anchor="middle" dominant-baseline="central"></text>
  <text id="greg" x="500" y="742" class="naskh" font-size="26" fill="#a8b4cc" text-anchor="middle" dominant-baseline="central"></text>

  <!-- العقارب -->
  <g filter="url(#shadow)">
    <g id="hHand">
      <path d="M500 520 L488 500 L494 330 L500 300 L506 330 L512 500 Z" fill="url(#gold)" stroke="#5a3f0e" stroke-width="1.5"/>
      <path d="M500 330 l-14 -26 l14 -26 l14 26z" fill="url(#gold)" stroke="#5a3f0e" stroke-width="1.5"/>
    </g>
    <g id="mHand">
      <path d="M500 530 L491 500 L496 170 L500 128 L504 170 L509 500 Z" fill="url(#gold)" stroke="#5a3f0e" stroke-width="1.5"/>
      <circle cx="500" cy="200" r="9" fill="url(#gold)" stroke="#5a3f0e" stroke-width="1.5"/>
    </g>
    <g id="sHand">
      <line x1="500" y1="580" x2="500" y2="110" stroke="#e8c15a" stroke-width="3"/>
      <circle cx="500" cy="560" r="12" fill="#e8c15a"/>
      <path d="M500 110 l-7 18 l7 -6 l7 6z" fill="#fff0b8"/>
    </g>
  </g>
  <!-- غطاء المركز -->
  <circle cx="500" cy="500" r="22" fill="url(#gold)" stroke="#5a3f0e" stroke-width="2"/>
  <circle cx="500" cy="500" r="9" fill="#7a1420" stroke="#f3d27a" stroke-width="2"/>

  <!-- لمعة الزجاج -->
  <g clip-path="url(#faceClip)" pointer-events="none">
    <ellipse cx="430" cy="250" rx="420" ry="230" fill="url(#glass)" transform="rotate(-18 430 250)"/>
  </g>
</svg>
</div>

<script>
/* توقيت الكويت ثابت (UTC+3) مهما كان ضبط الرسيفر */
var KW=3*3600*1000;
function kw(){ return new Date(Date.now()+KW); }
var AR_DIGITS="٠١٢٣٤٥٦٧٨٩";
function ar(n){ return String(n).replace(/[0-9]/g,function(d){return AR_DIGITS[+d];}); }
var DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
var HMONTHS=["محرم","صفر","ربيع الأول","ربيع الآخر","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];
var NS="http://www.w3.org/2000/svg";

/* العلامات: 60 علامة دقيقة + معيّنات الساعات */
(function(){
  var g=document.getElementById("ticks");
  for(var i=0;i<60;i++){
    var a=i*6;
    if(i%5===0){
      var p=document.createElementNS(NS,"path");
      p.setAttribute("d","M500 92 l-11 22 l11 22 l11 -22z");
      p.setAttribute("fill","url(#gold)");
      p.setAttribute("stroke","#5a3f0e");p.setAttribute("stroke-width","1");
      p.setAttribute("transform","rotate("+a+" 500 500)");
      g.appendChild(p);
    }else{
      var l=document.createElementNS(NS,"line");
      l.setAttribute("x1","500");l.setAttribute("y1","96");l.setAttribute("x2","500");l.setAttribute("y2","112");
      l.setAttribute("stroke","#d9b45a");l.setAttribute("stroke-width","3");l.setAttribute("stroke-linecap","round");
      l.setAttribute("transform","rotate("+a+" 500 500)");
      g.appendChild(l);
    }
  }
  var n=document.getElementById("nums");
  for(var h=1;h<=12;h++){
    var ang=(h*30-90)*Math.PI/180, r=200+0;
    var t=document.createElementNS(NS,"text");
    t.setAttribute("x",(500+330*Math.cos(ang)).toFixed(1));
    t.setAttribute("y",(500+330*Math.sin(ang)).toFixed(1));
    t.textContent=ar(h);
    n.appendChild(t);
  }
})();

/* التاريخ الهجري: من الإنترنت، ولو ما فيه نت نحسبه من المتصفح */
var hijriText="", hijriDay="";
function loadHijri(){
  var k=kw(), key=k.getUTCFullYear()+"-"+k.getUTCMonth()+"-"+k.getUTCDate();
  if(hijriDay===key) return;
  try{
    var f=new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-arab",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"});
    hijriText=f.format(k).replace(/\s*هـ$/,"")+" هـ";
  }catch(e){}
  var x=new XMLHttpRequest();
  x.open("GET","https://api.aladhan.com/v1/gToH/"+k.getUTCDate()+"-"+(k.getUTCMonth()+1)+"-"+k.getUTCFullYear());
  x.onload=function(){ try{
    var h=JSON.parse(x.responseText).data.hijri;
    hijriText=ar(+h.day)+" "+HMONTHS[h.month.number-1]+" "+ar(h.year)+" هـ";
    hijriDay=key; draw();
  }catch(e){} };
  x.send();
}

var hH=document.getElementById("hHand"), mH=document.getElementById("mHand"), sH=document.getElementById("sHand");
function draw(){
  var k=kw();
  var ms=k.getUTCMilliseconds(), s=k.getUTCSeconds()+ms/1000, m=k.getUTCMinutes()+s/60, h=(k.getUTCHours()%12)+m/60;
  hH.setAttribute("transform","rotate("+(h*30)+" 500 500)");
  mH.setAttribute("transform","rotate("+(m*6)+" 500 500)");
  sH.setAttribute("transform","rotate("+(s*6)+" 500 500)");
  var H=k.getUTCHours(), h12=H%12||12;
  document.getElementById("digital").textContent=ar((h12<10?"0":"")+h12)+":"+ar((k.getUTCMinutes()<10?"0":"")+k.getUTCMinutes())+" "+(H<12?"ص":"م");
  document.getElementById("hijri").textContent=hijriText;
  document.getElementById("greg").textContent=DAYS[k.getUTCDay()]+" "+ar(k.getUTCDate())+" "+MONTHS[k.getUTCMonth()]+" "+ar(k.getUTCFullYear());
}
function loop(){ draw(); requestAnimationFrame(loop); }
